[package]
name = "ubuntu-miracast-server"
version = "0.1.0-beta.1"
edition = "2021"
rust-version = "1.75"
description = "A Wi-Fi Display (Miracast) sink for Ubuntu — receive wireless screen casts from any Miracast source device."
license = "MIT"
repository = "https://github.com/arongate/ubuntu-miracast-server"
readme = "README.md"
keywords = ["miracast", "wfd", "wifi-display", "gstreamer", "gtk"]
categories = ["multimedia::video", "gui"]

[[bin]]
name = "ubuntu-miracast-server"
path = "src/main.rs"

[features]
# GUI is on by default; build the headless core with --no-default-features.
default = ["gui"]
gui = ["dep:gtk4", "dep:libadwaita", "dep:gstgtk4"]

[dependencies]
# GStreamer bound in-process (matches PyGObject Gst usage): dynamic pipeline,
# tsdemux pad-added linking, buffer pad-probe stats, bus-driven HW→SW fallback.
gstreamer = "0.23"
gstreamer-video = "0.23"
# gtk4paintablesink (GUI video output) — only needed with the GUI.
gstgtk4 = { package = "gst-plugin-gtk4", version = "0.13", optional = true }

# CLI parsing — mirrors argparse in app.py
clap = { version = "4.5", features = ["derive"] }
# Logging — mirrors Python logging (file + stderr, "%(asctime)s - %(name)s - %(levelname)s - %(message)s")
log = { version = "0.4", features = ["std"] }
# JSON config + history persistence (config.json / history.json)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# ISO 8601 datetimes for session records
chrono = { version = "0.4", features = ["serde"] }
# WPS PIN generation (non-crypto, matches Python random.randint use)
rand = "0.8"
# home dir resolution for ~/.config and ~/.local/share
dirs = "5.0"
# regex for MAC / event-line patterns
regex = "1.10"

# GUI stack (feature = "gui")
gtk4 = { version = "0.9", optional = true, features = ["v4_10"] }
libadwaita = { version = "0.7", optional = true, features = ["v1_4"] }

[dev-dependencies]
tempfile = "3"
